<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Endereços - Locadora Rebobina</title>
</head>
<body>
<header>
  <h1>Locadora Rebobina</h1>
  <nav aria-label="Menu principal">
    <a href="index.html">Início</a> | <a href="clientes.html">Clientes</a> |
    <a href="funcionarios.html">Funcionários</a> | <a href="enderecos.html">Endereços</a> |
    <a href="filmes.html">Filmes</a> | <a href="locacoes.html">Locações</a>
  </nav>
</header>
<main>
  <h2>Endereços</h2>
  <p>Campos com * são obrigatórios. O código e a data de cadastro são gerados ao salvar.</p>
  <form action="ClassServletBase" method="post" accept-charset="UTF-8">
    <input type="hidden" name="tipo" value="endereco">
    <p><label for="logradouro">Logradouro *</label><br>
    <input id="logradouro" name="logradouro" maxlength="255" required></p>
    <p><label for="bairro">Bairro</label><br>
    <input id="bairro" name="bairro" maxlength="150"></p>
    <p><label for="numero">Número</label><br>
    <input id="numero" name="numero" maxlength="30"></p>
    <p><label for="ibge">Código IBGE (7 dígitos) *</label><br>
    <input id="ibge" name="ibge" inputmode="numeric" pattern="[0-9]{7}" maxlength="7" required></p>
    <p><label for="cep">CEP (8 dígitos, sem hífen) *</label><br>
    <input id="cep" name="cep" inputmode="numeric" pattern="[0-9]{8}" maxlength="8" autocomplete="postal-code" required></p>
    <p><button type="submit">Salvar cadastro</button></p>
  </form>
  <h2>Consultar endereços</h2>
  <form action="ClassServletBase" method="get">
    <input type="hidden" name="tipo" value="endereco">
    <p><label for="q">Logradouro ou bairro</label><br>
    <input id="q" name="q" maxlength="200"></p>
    <button type="submit">Pesquisar</button>
    <a href="ClassServletBase?tipo=endereco">Ver todos</a>
  </form>
</main>
</body>
</html>
